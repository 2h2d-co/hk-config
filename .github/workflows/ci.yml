name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shared configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.2"
          install_args: --locked
          cache: false

      - name: Validate hk configuration
        run: hk validate

      - name: Check repository
        run: hk check --all --check

      - name: Evaluate GitHub Actions library
        run: pkl eval GitHubActions.pkl >/dev/null

      - name: Package shared configuration
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pkl-package"
          mkdir -p "$output"
          HK_CONFIG_VERSION=0.0.0 pkl project package \
            --skip-publish-check \
            --output-path "$output" \
            .
