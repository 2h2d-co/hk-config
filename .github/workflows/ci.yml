name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shared configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Distrust compromised eMudhra CA roots
        # Temporary until GitHub-hosted runner images ship the fixed ca-certificates
        # package (actions/runner-images#15018). Debian's fixed package disables the same roots.
        run: |
          sudo sed -i -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt|!&|' -e 's|^mozilla/Comodo_AAA_Services_root.crt|!&|' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh >/dev/null
          # PEM lines unique to emSign ECC Root CA - G3 and AAA Certificate Services.
          for needle in RzMwHhcNMTgwMjE4MTgzMDAwWhcNNDMwMjE4MTgzMDAwWjBrMQswCQYDVQQGEwJJ YXRlIFNlcnZpY2VzMB4XDTA0MDEwMTAwMDAwMFoXDTI4MTIzMTIzNTk1OVowezEL; do
            if grep -qF "$needle" /etc/ssl/certs/ca-certificates.crt; then
              echo "A compromised eMudhra root is still trusted" >&2
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: "2026.10.18"
          install_args: --locked
          cache: false

      - name: Validate hk configuration
        run: hk validate

      - name: Check repository
        run: hk check --all --check

      - name: Test hk-config steps
        run: hk test --step python-check-ast --step python-debug-statements --step ruff --step ruff-format

      - name: Evaluate GitHub Actions library
        run: pkl eval GitHubActions.pkl >/dev/null

      - name: Package shared configuration
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pkl-package"
          mkdir -p "$output"
          HK_CONFIG_VERSION=0.0.0 pkl project package \
            --skip-publish-check \
            --output-path "$output" \
            .
