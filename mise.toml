[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"

[tools]
hk = { version = "2.8.0", workflow = "release.yml", postinstall = "hk install --mise" }
pkl = "0.32.2"
betterleaks = "1.9.0"
cocogitto = "7.0.0"
zizmor = "1.30.1"
jactionlint = "2.3.0"
shfmt = "3.14.1"
shellcheck = "0.11.0"
python = "3.15.0"
ruff = "0.17.0"

[tasks.check]
description = "Run all non-writing project checks"
run = [
  "hk validate",
  "hk check --all --check",
  "hk test --step python-check-ast --step python-debug-statements --step ruff --step ruff-format",
  """
#!/usr/bin/env bash
set -euo pipefail
package_dir="$(mktemp -d)"
trap 'rm -rf "$package_dir"' EXIT
HK_CONFIG_VERSION=0.0.0 pkl project package --skip-publish-check --output-path "$package_dir" . >/dev/null
""",
]
